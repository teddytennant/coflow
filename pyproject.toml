[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coflow"
version = "0.1.0"
description = "Contextual flow matching adaptive step selection"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/coflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
